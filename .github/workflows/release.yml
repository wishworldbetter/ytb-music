name: Release

# A tag v* makes a draft release of the Windows and Linux apps, built on
# Ubuntu, as MyGo needs no cgo. The macOS app is built, signed with the
# Developer ID and notarized on a Mac, and added to the same draft:
# scripts/release-mac.sh -upload.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check the tag is the version of mygo.json
        run: |
          version=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, version $version"; exit 1; }
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(build/windows-*/*-setup-*.exe build/linux-*/*.deb build/linux-*/*.tar.gz)
          test ${#files[@]} -gt 0
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
